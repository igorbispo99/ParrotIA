<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Resolve fonts inside this Snap, independently of the host desktop's
       font paths, configuration and caches. Paths are relative to etc/fonts. -->
  <dir prefix="relative">../../usr/share/fonts</dir>
  <dir prefix="relative">../../lib/python3.12/site-packages/customtkinter/assets/fonts</dir>
  <cachedir prefix="xdg">fontconfig</cachedir>
  <alias><family>sans-serif</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias><family>serif</family><prefer><family>DejaVu Serif</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>DejaVu Sans Mono</family></prefer></alias>
</fontconfig>
