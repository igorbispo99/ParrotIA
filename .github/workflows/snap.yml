name: Snap package

on:
  pull_request:
    paths: ["src/**", "snap/**", "packaging/launcher.py", "pyproject.toml", "MANIFEST.in", ".github/workflows/snap.yml"]
  push:
    branches: [main, master, codex/snap-store]
    paths: ["src/**", "snap/**", "packaging/launcher.py", "pyproject.toml", "MANIFEST.in", ".github/workflows/snap.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install source test environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb
          python -m pip install -r snap/requirements.txt
          python -m pip install --no-deps -e .
          python -m pip install pytest ruff
      - name: Check source and Snap helpers
        run: |
          ruff check src tests packaging snap
          ruff format --check src tests packaging snap
          HF_HUB_OFFLINE=1 xvfb-run -a python -m pytest
  build:
    needs: source-tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate desktop entry and shell launcher
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y desktop-file-utils xvfb xauth espeak-ng ffmpeg squashfs-tools
          sed 's|${SNAP}|/snap/parrotia/current|g' snap/gui/parrotia.desktop > /tmp/parrotia.desktop
          desktop-file-validate /tmp/parrotia.desktop
          sh -n snap/local/command-chain
      - uses: snapcore/action-build@v1
        id: snapcraft
        with:
          snapcraft-channel: latest/stable
          snapcraft-args: --platform=${{ matrix.arch }}
      - name: Install strictly confined package
        env:
          SNAP_FILE: ${{ steps.snapcraft.outputs.snap }}
        run: |
          sudo snap install --dangerous "$SNAP_FILE"
          snap connections parrotia
          parrotia --help
      - name: Exercise packaged native libraries, cache and GUI
        run: |
          HF_HUB_OFFLINE=1 parrotia.check
          timeout 120s xvfb-run -a -s "-screen 0 1280x1024x24 -ac" env XAUTHORITY= parrotia.check --gui
          test -f /var/lib/snapd/desktop/applications/parrotia_parrotia.desktop
      - name: Check bundled fonts at normal and high DPI with no server font paths
        run: |
          mkdir -p dist/snap-review
          for dpi in 96 192; do
            FONTCONFIG_FILE=/missing-host-fonts.conf FONTCONFIG_PATH=/missing-host-fonts \
              timeout 120s xvfb-run -a -s "-screen 0 1920x1600x24 -dpi $dpi -fp built-ins -ac" \
              env XAUTHORITY= parrotia.check --gui | tee "dist/snap-review/fonts-$dpi.json"
            cp "$HOME/snap/parrotia/common/qa-fonts.png" "dist/snap-review/fonts-$dpi.png"
          done
      - name: Exercise CPU inference and offline model reuse
        run: |
          timeout 600s parrotia.check --model tiny
          HF_HUB_OFFLINE=1 timeout 120s parrotia.check --model tiny
      - name: Exercise real speech, confinement, GUI workflow and refresh/revert
        env:
          SNAP_FILE: ${{ steps.snapcraft.outputs.snap }}
        run: bash snap/local/release-qa.sh
      - name: Preserve release QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parrotia-snap-qa-${{ matrix.arch }}
          path: dist/snap-review/
      - name: Preserve package for review
        if: ${{ always() && steps.snapcraft.outputs.snap != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: parrotia-snap-${{ matrix.arch }}
          path: ${{ steps.snapcraft.outputs.snap }}
          if-no-files-found: error
      - name: Remove test installation
        if: always()
        run: sudo snap remove --purge parrotia || true
