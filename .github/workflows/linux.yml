name: Linux installers

on:
  push:
    branches: [main, master]
    paths:
      - "src/**"
      - "packaging/**"
      - "pyproject.toml"
      - ".github/workflows/linux.yml"
  pull_request:
    paths:
      - "src/**"
      - "packaging/**"
      - "pyproject.toml"
      - ".github/workflows/linux.yml"
  workflow_dispatch: {}
  workflow_call: {}

permissions:
  contents: read

jobs:
  installers:
    # Build on the oldest supported glibc rather than linking against the latest.
    name: Linux installers (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: amd64
            rpm-arch: x86_64
            python-arch: x64
          - os: ubuntu-22.04-arm
            arch: arm64
            rpm-arch: aarch64
            python-arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.python-arch }}
      - name: Check runner tools and install Python build dependencies
        run: |
          sudo apt-get update -qq -o Acquire::Retries=3
          sudo apt-get install -y binutils rpm xvfb xauth python3-tk desktop-file-utils
          python -c "import tkinter; print('Tk', tkinter.TkVersion)"
          python -m pip install ".[linux-build]"
      - name: Build and smoke-test standalone app, then DEB and RPM packages
        run: xvfb-run -a python packaging/linux/build.py
      - name: Validate desktop entry and package metadata
        run: |
          if command -v desktop-file-validate >/dev/null; then
            desktop-file-validate packaging/linux/parrotia.desktop
          fi
          test "$(dpkg-deb -f dist/installer/*.deb Architecture)" = "${{ matrix.arch }}"
          test "$(rpm -qp --qf '%{ARCH}' dist/installer/*.rpm)" = "${{ matrix.rpm-arch }}"
          dpkg-deb --info dist/installer/*.deb
          rpm -qip dist/installer/*.rpm
      - uses: actions/upload-artifact@v4
        with:
          name: linux-installers-${{ matrix.arch }}
          path: |
            dist/installer/*.deb
            dist/installer/*.rpm
          if-no-files-found: error
      - name: Install, run, and remove DEB on Ubuntu
        run: |
          # All declared desktop dependencies are present on this hosted image.
          # apt still verifies them; no unrelated repository refresh is needed.
          sudo apt-get install -y ./dist/installer/*.deb
          test -f /usr/share/applications/parrotia.desktop
          test -f /usr/share/icons/hicolor/256x256/apps/parrotia.png
          # Use the native launcher, not pip's earlier entry on setup-python's PATH.
          timeout 120s xvfb-run -a /usr/bin/parrotia-gui --smoke-test /tmp/parrotia-smoke.json
          cat /tmp/parrotia-smoke.json
          sudo apt-get purge -y parrotia
          test ! -e /opt/parrotia
          test ! -e /usr/bin/parrotia-gui
          test ! -e /usr/share/applications/parrotia.desktop
      - name: Install, run, and remove RPM in clean Fedora
        run: |
          docker run --rm -v "$PWD/dist/installer:/packages:ro" fedora:43 bash -euc '
            dnf install -y /packages/*.rpm xorg-x11-server-Xvfb xorg-x11-xauth
            test -f /usr/share/applications/parrotia.desktop
            test -f /usr/share/icons/hicolor/256x256/apps/parrotia.png
            Xvfb :99 -screen 0 1024x768x24 &
            export DISPLAY=:99
            sleep 2
            timeout 120s /usr/bin/parrotia-gui --smoke-test /tmp/parrotia-smoke.json
            cat /tmp/parrotia-smoke.json
            dnf remove -y parrotia
            test ! -e /opt/parrotia
            test ! -e /usr/bin/parrotia-gui
            test ! -e /usr/share/applications/parrotia.desktop
          '
