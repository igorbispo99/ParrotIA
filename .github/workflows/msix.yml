name: Microsoft Store package

# Builds an MSIX of the frozen app with a placeholder identity and checks that
# it installs and runs under package identity. The artifact is for testing only:
# a Store submission uses the identity Partner Center assigns (docs/microsoft-store-roadmap.md).

on:
  workflow_dispatch: {}
  push:
    # msix/** are development branches for iterating on this workflow.
    branches: [main, master, "msix/**"]
    paths:
      - "packaging/windows/msix.py"
      - "packaging/windows/test-msix.ps1"
      - ".github/workflows/msix.yml"
  pull_request:
    paths:
      - "packaging/windows/msix.py"
      - "packaging/windows/test-msix.ps1"
      - ".github/workflows/msix.yml"

permissions:
  contents: read

jobs:
  msix:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
      - name: Install build dependencies
        run: python -m pip install ".[windows-build]"
      - name: Build and smoke-test standalone app
        run: python packaging/windows/build.py --bundle-only
      - name: Build test MSIX
        run: python packaging/windows/msix.py --test-package
      - name: Install and smoke-test the package
        shell: powershell
        run: |
          $package = (Get-ChildItem dist/msix/*-test.msix).FullName
          ./packaging/windows/test-msix.ps1 -Package $package
      - uses: actions/upload-artifact@v4
        with:
          name: windows-msix-test
          path: dist/msix/*-test.msix
          if-no-files-found: error
