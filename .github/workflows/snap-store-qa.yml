name: Snap Store delivery QA

on:
  workflow_dispatch:
    inputs:
      architecture:
        description: Architecture of the Store revision
        type: choice
        options: [arm64, amd64]
        default: arm64
        required: true
      revision:
        description: Exact Store revision to install from edge
        type: string
        required: true
      sha256:
        description: SHA-256 of the reviewed original Snap artifact
        type: string
        required: true

permissions:
  contents: read

jobs:
  store-delivery:
    runs-on: ${{ inputs.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    env:
      EXPECTED_REVISION: ${{ inputs.revision }}
      EXPECTED_SHA256: ${{ inputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate requested artifact identity
        run: |
          [[ "$EXPECTED_REVISION" =~ ^[0-9]+$ ]]
          [[ "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ ]]
      - name: Install desktop test tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb xauth espeak-ng ffmpeg squashfs-tools dbus-x11 python3-dbus python3-gi
      - name: Install exact signed revision from edge
        run: |
          sudo snap install parrotia --channel=latest/edge --revision="$EXPECTED_REVISION"
          test "$(readlink /snap/parrotia/current)" = "$EXPECTED_REVISION"
          actual=$(sudo sha256sum "/var/lib/snapd/snaps/parrotia_${EXPECTED_REVISION}.snap" | cut -d ' ' -f 1)
          test "$actual" = "$EXPECTED_SHA256"
          mkdir -p review
          snap list parrotia > review/installed-version.log
          snap connections parrotia > review/connections.log
          parrotia --help
      - name: Exercise signed runtime and offline cache
        run: |
          timeout 600s parrotia.check --model tiny | tee review/first-model.json
          HF_HUB_OFFLINE=1 timeout 120s parrotia.check --model tiny | tee review/offline.json
      - name: Verify signed desktop identity and dark/light changes
        run: |
          test "$(find /var/lib/snapd/desktop/applications -maxdepth 1 -name 'parrotia_*.desktop' | wc -l)" -eq 1
          fixture="$HOME/Documents/ParrotIA Store Desktop QA"
          timeout 120s xvfb-run -a -s "-screen 0 1280x1024x24 -ac" env XAUTHORITY= \
            python3 snap/local/desktop_qa.py "$fixture" parrotia.check
          cp "$fixture/desktop.json" review/desktop.json
          cp "$HOME/snap/parrotia/common/qa-desktop-dark.png" review/
          cp "$HOME/snap/parrotia/common/qa-desktop-light.png" review/
      - name: Exercise GUI from Store-installed Snap
        run: |
          fixture="$HOME/Documents/ParrotIA Store QA/audio café.wav"
          mkdir -p "$(dirname "$fixture")"
          espeak-ng -v en-us -s 135 -w "$fixture" "Hello. This is a test of local audio transcription. The quick brown fox jumps over the lazy dog."
          HF_HUB_OFFLINE=1 timeout 300s xvfb-run -a -s "-screen 0 1280x1024x24 -ac" env XAUTHORITY= parrotia.check --exercise-gui "$fixture" | tee review/gui.json
          cp "$HOME/snap/parrotia/common/qa-gui.png" review/gui.png
      - name: Verify signed codecs, confinement and refresh/revert
        run: |
          export SNAP_FILE="$RUNNER_TEMP/reviewed.snap"
          sudo cp "/var/lib/snapd/snaps/parrotia_${EXPECTED_REVISION}.snap" "$SNAP_FILE"
          sudo chmod 644 "$SNAP_FILE"
          bash snap/local/release-qa.sh
          cp -r dist/snap-review review/full-release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snap-store-delivery-qa-${{ inputs.architecture }}
          path: review/
      - name: Remove test installation
        if: always()
        run: sudo snap remove --purge parrotia || true
