name: Windows installer

on:
  push:
    branches: [main, master]
    paths:
      - "src/**"
      - "packaging/**"
      - "pyproject.toml"
      - ".github/workflows/windows.yml"
  workflow_dispatch: {}
  workflow_call: {}
  pull_request:
    paths:
      - "src/**"
      - "packaging/**"
      - "pyproject.toml"
      - ".github/workflows/windows.yml"

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
      - name: Install build dependencies
        run: python -m pip install ".[windows-build]"
      - name: Install installer compiler
        run: choco install innosetup --yes --no-progress
      - name: Build and smoke-test standalone app, then compile installer and MSIX
        run: python packaging/windows/build.py --msix
      - name: Verify shortcuts, Explorer registration, and uninstall
        shell: pwsh
        run: |
          $installer = (Get-ChildItem dist/installer/*-setup.exe).FullName
          ./packaging/windows/test-installer.ps1 -Installer $installer
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/installer/*-setup.exe
          if-no-files-found: error
      - name: Install MSIX with a test signature, verify integration and WACK
        shell: pwsh
        run: |
          $package = (Get-ChildItem dist/msix/*.msix).FullName
          $wack = Test-Path "${env:ProgramFiles(x86)}\Windows Kits\10\App Certification Kit\appcert.exe"
          if (-not $wack) { Write-Warning "Windows App Certification Kit is not installed; skipping WACK." }
          ./packaging/windows/test-msix.ps1 -Package $package -Wack:$wack
      - name: Keep WACK report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-msix-reports
          path: build/windows/msix-test/*.xml
          if-no-files-found: ignore
      # Unsigned: the Store signs it on submission. Upload this file in Partner Center.
      - uses: actions/upload-artifact@v4
        with:
          name: windows-msix
          path: dist/msix/*.msix
          if-no-files-found: error
