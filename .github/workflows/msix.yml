name: Microsoft Store package

# `msix` builds an MSIX with a placeholder identity and checks that it installs
# and runs under package identity; its artifact is for testing only.
# `store-package` builds the unsigned package with the identity Partner Center
# assigned to the reserved product (docs/microsoft-store-roadmap.md) once the
# test passes. Upload that artifact manually in Partner Center.

on:
  workflow_dispatch: {}
  push:
    # msix/** are development branches for iterating on this workflow.
    branches: [main, master, "msix/**"]
    paths:
      - "packaging/windows/**"
      - "src/**"
      - ".github/workflows/msix.yml"
  pull_request:
    paths:
      - "packaging/windows/**"
      - "src/**"
      - ".github/workflows/msix.yml"

permissions:
  contents: read

jobs:
  msix:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
      - name: Install build dependencies
        run: python -m pip install ".[windows-build]"
      - name: Build and smoke-test standalone app
        run: python packaging/windows/build.py --bundle-only
      - name: Build test MSIX
        run: python packaging/windows/msix.py --test-package
      - name: Install and smoke-test the package
        shell: powershell
        run: |
          $package = (Get-ChildItem dist/msix/*-test.msix).FullName
          ./packaging/windows/test-msix.ps1 -Package $package
      - uses: actions/upload-artifact@v4
        with:
          name: windows-msix-test
          path: dist/msix/*-test.msix
          if-no-files-found: error

  store-package:
    needs: msix
    runs-on: windows-latest
    env:
      # Product identity of the reserved "ParrotIA" product (public values).
      MSIX_IDENTITY_NAME: IgorBispo.ParrotIA
      MSIX_PUBLISHER: CN=8D013184-D3B0-4A06-98A9-CD149E2D2315
      MSIX_PUBLISHER_DISPLAY_NAME: Igor Bispo
      # The notices must match the bundled native libraries exactly.
      PARROTIA_STRICT_NOTICES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
      - name: Install build dependencies
        run: python -m pip install ".[windows-build]"
      - name: Build and smoke-test standalone app
        run: python packaging/windows/build.py --bundle-only
      - name: Build Store MSIX
        run: python packaging/windows/msix.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows-msix-store
          path: dist/msix/ParrotIA-*-windows-x64.msix
          if-no-files-found: error
